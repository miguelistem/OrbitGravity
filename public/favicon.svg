<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background coordinate grid pattern -->
    <pattern id="orbit-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#22252E" stroke-width="0.75" />
    </pattern>

    <!-- Chrome & Titanium metallic gradients -->
    <linearGradient id="orbit-chrome" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="orbit-ring" x1="10" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#64748B" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#E2E8F0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="orbit-core" cx="42" cy="42" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <linearGradient id="border-metal" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <clipPath id="squircle-clip">
      <rect x="2" y="2" width="96" height="96" rx="26" />
    </clipPath>
  </defs>

  <!-- Dark squircle container with metallic titanium bezel -->
  <rect
    x="2"
    y="2"
    width="96"
    height="96"
    rx="26"
    fill="#0B0D13"
    stroke="url(#border-metal)"
    stroke-width="1.5"
  />

  <!-- Coordinate grid clip inside squircle -->
  <g clip-path="url(#squircle-clip)">
    <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#orbit-grid)" opacity="0.75" />
  </g>

  <!-- Primary Orbital Ring (Angle 1) -->
  <ellipse cx="50" cy="50" rx="41" ry="16" transform="rotate(-32 50 50)" stroke="url(#orbit-chrome)" stroke-width="4.2" stroke-linecap="round" fill="none" />

  <!-- Secondary Orbital Ring (Angle 2) -->
  <ellipse cx="50" cy="50" rx="41" ry="16" transform="rotate(42 50 50)" stroke="url(#orbit-ring)" stroke-width="2.8" fill="none" opacity="0.85" />

  <!-- Central Chrome Singularity Core -->
  <circle cx="50" cy="50" r="17" fill="url(#orbit-core)" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Specular Star Flare at Tangent -->
  <circle cx="83" cy="30" r="3.5" fill="#FFFFFF" />
  <path d="M 83 20 L 84.5 29 L 93 30 L 84.5 31 L 83 40 L 81.5 31 L 73 30 L 81.5 29 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
