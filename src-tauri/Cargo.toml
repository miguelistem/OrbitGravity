[package]
name = "orbitgravity"
version = "2.0.1"
description = "Antigravity Mission Control for Windows"
authors = ["OrbitGravity Contributors"]
license = "MIT"
repository = "https://github.com/miguelistem/OrbitGravity"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "6.0"
rfd = "0.17.2"
